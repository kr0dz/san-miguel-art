<style>
:root{--bg:#f2ede4;--paper:#fffaf3;--ink:#171512;--mut:#756f67;--gold:#9c7548;--line:#d9d0c4;--danger:#9c3328;--ok:#2f7149;--ser:'Instrument Serif',serif;--sans:'DM Sans',sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans)}button,input,textarea,select{font:inherit}button{cursor:pointer}a{color:inherit}.hidden{display:none!important}.btn{border:1px solid var(--ink);background:transparent;color:var(--ink);padding:11px 15px;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}.btn.dark{background:var(--ink);color:#fff}.btn.ghost{border-color:var(--line)}.btn.danger{border-color:#d8aaa5;color:var(--danger)}.login{min-height:100vh;display:grid;place-items:center;padding:22px}.login-card{width:min(500px,100%);background:var(--paper);border:1px solid var(--line);padding:44px}.eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:.2em;color:var(--gold);font-weight:600}.login h1,.brand,.workspace h1,.editor h2,.media-title{font-family:var(--ser);font-weight:400}.login h1{font-size:54px;line-height:.9;margin:12px 0 18px}.login p{color:var(--mut);line-height:1.65}.field{display:grid;gap:7px;margin:10px 0}.field>span,.micro{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--mut)}input,textarea,select{width:100%;border:1px solid var(--line);background:#fff;padding:11px 12px;color:var(--ink)}textarea{min-height:112px;resize:vertical}.msg{margin-top:12px;font-size:13px}.msg.error{color:var(--danger)}.msg.ok{color:var(--ok)}.shell{min-height:100vh;display:grid;grid-template-columns:270px 1fr}.sidebar{position:sticky;top:0;height:100vh;background:#151411;color:#fff;padding:28px 20px;display:flex;flex-direction:column}.brand{font-size:40px}.brand-sub{font-size:9px;text-transform:uppercase;letter-spacing:.16em;color:#a9a39b;margin-top:3px}.navtabs{display:grid;gap:4px;margin-top:30px;overflow:auto}.navtabs button{border:0;background:transparent;color:#c7c1b8;text-align:left;padding:10px 12px;font-size:12px}.navtabs button.active{background:#2a2824;color:#fff}.side-bottom{margin-top:auto;display:grid;gap:10px;padding-top:16px}.side-bottom a{font-size:12px;color:#c7c1b8;text-decoration:none}.workspace{min-width:0}.topbar{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:12px;padding:16px 26px;background:rgba(242,237,228,.96);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}.topbar h1{font-size:29px;margin:0}.topbar .spacer{flex:1}.save-state{font-size:11px;color:var(--mut);max-width:210px}.editor{padding:34px 32px 90px;max-width:1240px;margin:auto}.editor-head{display:flex;justify-content:space-between;gap:24px;align-items:end;margin-bottom:26px}.editor h2{font-size:54px;line-height:.9;margin:7px 0}.editor-head p{max-width:620px;color:var(--mut);line-height:1.6;margin:0}.panel{background:var(--paper);border:1px solid var(--line);padding:24px;margin-bottom:18px}.panel-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 18px}.switchrow{display:flex;align-items:center;justify-content:space-between;gap:20px}.switchrow input{width:auto}.media-list{display:grid;gap:14px;margin-top:18px}.media-card{display:grid;grid-template-columns:170px 1fr;gap:18px;border:1px solid var(--line);background:#fff;padding:12px}.thumb{height:150px;background:#ddd;overflow:hidden}.thumb img{width:100%;height:100%;object-fit:cover}.media-fields{display:grid;gap:9px}.media-actions{display:flex;gap:7px;flex-wrap:wrap}.media-actions .btn{padding:8px 10px;font-size:9px}.media-title{font-size:28px;margin:0}.uploadbar{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}.upload-input{display:none}.works-list{display:grid;gap:14px}.work-card{border:1px solid var(--line);background:#fff;padding:13px;display:grid;grid-template-columns:180px 1fr;gap:16px}.work-card .thumb{width:180px;height:170px}.work-fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}.work-fields .wide{grid-column:1/-1}.video-row{display:flex;gap:15px;align-items:center;border-bottom:1px solid var(--line);padding:14px 0}.video-row:first-child{border-top:1px solid var(--line)}.video-info{flex:1;min-width:0}.video-info strong{font:25px var(--ser)}.video-info small{display:block;color:var(--mut);margin-top:3px;overflow-wrap:anywhere}.statusbox{padding:14px 16px;background:#eee5d8;color:#5b534a;font-size:12px;line-height:1.65}.statusbox strong{color:var(--ink)}.setup{border-left:3px solid var(--gold)}.mobile-nav{display:none}.loader{min-height:50vh;display:grid;place-items:center;color:var(--mut)}#pageSelect{min-width:260px}
@media(max-width:980px){.shell{grid-template-columns:1fr}.sidebar{display:none}.mobile-nav{display:flex;gap:8px;overflow:auto;padding:12px 16px;background:#151411;position:sticky;top:0;z-index:12}.mobile-nav button{white-space:nowrap;border:1px solid #ffffff30;background:transparent;color:#ddd;padding:8px 10px}.mobile-nav button.active{background:#fff;color:#111}.topbar{top:53px;padding:12px 16px;flex-wrap:wrap}.topbar h1{display:none}#pageSelect{width:100%!important;max-width:none!important}.editor{padding:25px 16px 90px}.panel-grid{grid-template-columns:1fr}.media-card,.work-card{grid-template-columns:1fr}.thumb,.work-card .thumb{width:100%;height:260px}.work-fields{grid-template-columns:1fr}.work-fields .wide{grid-column:auto}.editor h2{font-size:46px}.editor-head{display:block}.editor-head p{margin-top:12px}.video-row{align-items:flex-start;flex-direction:column}.login-card{padding:30px 24px}}

<body>
<section id="loginView" class="login"><div class="login-card"><div class="eyebrow">Administración privada</div><h1>SMArt CMS</h1><p>Edita cualquier página del sitio: secciones, imágenes, orden, CTAs, SEO y contenido bilingüe. El token de GitHub permanece solo en el servidor.</p><form id="loginForm"><label class="field"><span>Contraseña de administrador</span><input id="adminPassword" type="password" autocomplete="current-password" required></label><button class="btn dark" type="submit">Entrar</button></form><div id="loginMessage" class="msg"></div></div></section>
