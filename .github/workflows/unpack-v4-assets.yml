name: Unpack V4 artwork assets

on:
  push:
    paths:
      - '.asset-staging/READY'

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Unpack optimized artwork
        shell: bash
        run: |
          set -euo pipefail
          test -f .asset-staging/v4-media.zip
          mkdir -p images
          unzip -o .asset-staging/v4-media.zip -d images
          rm -rf .asset-staging

      - name: Commit artwork files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images .asset-staging
          if ! git diff --cached --quiet; then
            git commit -m "Add V4 optimized artwork assets [skip ci]"
            git push
          fi
