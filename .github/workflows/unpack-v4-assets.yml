name: Unpack V4 artwork assets

on:
  push:
    paths:
      - '.asset-staging/READY'

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild artwork package
        shell: bash
        run: |
          set -euo pipefail
          cat .asset-staging/v4part_* > /tmp/v4assets.b64
          base64 -d /tmp/v4assets.b64 > /tmp/v4assets.zip
          mkdir -p assets/images/v4
          unzip -o /tmp/v4assets.zip -d assets/images/v4
          rm -rf .asset-staging

      - name: Commit rebuilt images
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/v4 .asset-staging
          if ! git diff --cached --quiet; then
            git commit -m "Add V4 optimized artwork assets [skip ci]"
            git push
          fi
